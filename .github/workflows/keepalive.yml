name: keepalive

# GitHub disables scheduled workflows in repos with no activity for 60 days.
# This commits a trivial timestamp weekly so the watcher never gets switched off.
on:
  schedule:
    - cron: '13 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive"
          git push
